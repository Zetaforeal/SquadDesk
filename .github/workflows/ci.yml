name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: mysql://root:password@127.0.0.1:3306/super_saas
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate --workspace server
      - run: npx prisma validate --schema server/prisma/schema.prisma
      - run: npm test
      - run: npm run build
      - run: npm audit --workspaces --audit-level=high
